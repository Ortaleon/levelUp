<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/styles.css">
    <title>LevelUp System</title>
</head>
<body>

<header class="container">
    <div class="user">
        <svg class="user__progress-bar" width="200" height="200" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="54"
                    fill="none"
                    stroke="#333366"
                    stroke-width="8"/>

            <circle id="circleProgress" data-js-progress-circle cx="60" cy="60" r="54"
                    fill="none"
                    stroke="#cc99ff"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="339.3"
                    stroke-dashoffset="339.3"
                    transform="rotate(-90 60 60)"/>
        </svg>
        <p class="user__level">Level<span class="user__level--number" data-js-level></span></p>
        <p class="user__progress"><span data-js-progress-bar></span></p>
    </div>
    <div class="finances">
        <div class="finances__emergency-fund">
            <svg width="100" height="100" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="16" width="48" height="32" rx="10" fill="none" stroke="#E7BDFE" stroke-width="2"/>
                <text x="32" y="38" text-anchor="middle" font-size="18" color="#E7BDFE" fill="#E7BDFE" font-family="Arial, sans-serif" font-weight="bold">zl</text>
                <path d="M12 20 H52 M12 44 H52" stroke="#E7BDFE" stroke-width="1.5" stroke-dasharray="3 3"/>
            </svg>
            <span data-js-emergency-fund></span>
        </div>
    </div>
</header>

<main>
    <section class="tasks container">
        <h2 class="tasks__title">Task Management</h2>
        <ul class="tasks__list" data-js-task-list></ul>
    </section>
    <section class="create-task">
        <h2 class="visually-hidden">Create task form</h2>
        <button class="create-task__button create-task__button--open" onclick="createTaskForm.showModal()">+</button>
        <dialog class="create-task__wrapper" id="createTaskForm">
            <div class="create-task__form">
                <span class="create-task__button create-task__button--close" onclick="createTaskForm.close()">+</span>
                <input class="create-task__input create-task__input--text" name="task" type="text" placeholder="Задача">
                <input class="create-task__input create-task__input--xp" name="exp" type="number" placeholder="Опыт">
                <button class="create-task__button create-task__button--create" onclick="createTaskForm.close()" data-js-task-add>Add</button>
            </div>
        </dialog>
    </section>
</main>
<a href="https://cors-anywhere.herokuapp.com/">Open proxy</a>







<script type="module" src="scripts/script.js"></script>
</body>
</html>
