<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>LevelUp Settings</title>
</head>
<body>
<main>
    <section class="container">
        <h2 class="visually-hidden">Settings</h2>
        <form action="#" class="settings__form" id="settings">
            <fieldset class="settings__trading212">
                <legend>API trading212</legend>
                <label for="apiKey">Api key</label>
                <input id="apiKey" type="text" name="apiKey">
                <label for="apiSecret">Api secret</label>
                <input id="apiSecret" type="text" name="apiSecret">
                <button class="settings__save">Save</button>
            </fieldset>

        </form>
    </section>
</main>
<script src="../scripts/settings.js" type="module"></script>
</body>
</html>
